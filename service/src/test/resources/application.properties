# Test-only overrides. Nothing else.
#
# This module is the deployable, so `src/main/resources/application.properties` is on the test
# classpath too and Quarkus MERGES it — a key removed from here keeps the shipped value. So
# app-level settings are INHERITED and must never be re-declared here: a test copy that silently
# drifts from the shipped one makes the whole suite lie about what the packaged app does.
#
# What belongs here is only what a test genuinely needs to be different: the database, and the
# on-disk tree it is allowed to write to.

# The suite runs against in-memory H2 (no docker), overriding the file-H2 default shipped in
# domain's META-INF/microprofile-config.properties. clean-at-start wipes between runs.
quarkus.datasource.workspaces.db-kind=h2
quarkus.datasource.workspaces.jdbc.url=jdbc:h2:mem:workspaces;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.workspaces.datasource=workspaces
quarkus.hibernate-orm.workspaces.packages=eu.wohlben.qits.workspaces.entity
quarkus.flyway.workspaces.migrate-at-start=true
quarkus.flyway.workspaces.clean-at-start=true
quarkus.flyway.workspaces.locations=classpath:db/workspaces/migration

# Bare origins and metadata sidecars go under target/, so a run leaves nothing behind.
qits.repositories.data-dir=target/workspaces-test-data

# The same three lines again for the outbox's datasource, shipped file-H2 in the qits-eventstream
# jar's own META-INF/microprofile-config.properties. It is needed even though the bus is DARK in
# %test: `qits.eventstream.enabled=false` stops publishing and sweeping, not the datasource —
# Quarkus opens the connection and runs Flyway at boot regardless, so without this the suite would
# create and migrate a real ~/.qits/data/eventstream, and two builds on one host would race for its
# single-writer file. Test-only, exactly like the block above: the shipped value is the
# deployment's and is not restated in src/main.
quarkus.datasource.eventstream.db-kind=h2
quarkus.datasource.eventstream.jdbc.url=jdbc:h2:mem:eventstream;DB_CLOSE_DELAY=-1
quarkus.flyway.eventstream.clean-at-start=true
