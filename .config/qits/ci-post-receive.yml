# The pipeline qits-ci runs on every push to a tracked branch of this repository.
#
# One step: build this repo's docker/Dockerfile and publish it under the tag that is the whole
# contract with qits-cd — <registry>/<repository>/<this repo's name>:<sha>. The step's own
# container only drives the docker CLI; the build and the push happen in the host's daemon
# through the socket this step declares (docker: true), which is also why the native build's
# memory is the daemon's and not this container's. A failed push is a failed step is a FAILED
# run, so the CD announcement (SUCCESS only) keeps implying "the image exists".
#
# A verify step belongs ahead of this one once a JDK build image exists; today the Dockerfile's
# own native stage is the gate.
steps:
  - image: qits/build-images/ci-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed docker build is
      # swallowed: the push fails, `docker rmi || true` answers 0, the run reports SUCCESS, and cd
      # is told an image exists that does not (the exact shape of the qits-workspaces
      # IMAGE_MISSING incident). -u makes an unset registry variable stop the step too.
      set -eu

      # The daemon's clone is `--depth 50` and does not recurse, so the qits-spa-workspaces submodule
      # at service/src/main/webui arrives as an empty directory — and Quinoa fails the image build on
      # exactly that (`No package.json found in Web UI directory`). Initialising it here rather than
      # asking the daemon to clone differently keeps the submodule this repo's business.
      #
      # Unlike its sibling spa repos, qits-spa-workspaces is PRIVATE on GitHub, and this container
      # holds no credential — an anonymous clone dies on "could not read Username". The platform's
      # own git host carries the repo, so the fetch is redirected there without editing the tracked
      # .gitmodules. Drop the insteadOf line the day the repo goes public.
      git config url."http://qits-artifacts:8080/artifacts/git/qits-spa-workspaces".insteadOf \
          "https://github.com/QuicklyIterateTheSoftware/qits-spa-workspaces.git"
      git submodule update --init --depth 1 service/src/main/webui

      ref="$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-workspaces:$QITS_CI_SHA"
      docker build -t "$ref" -f docker/Dockerfile .
      docker push "$ref"
      docker rmi "$ref" || true
