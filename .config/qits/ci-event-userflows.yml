# The per-commit userflow run: `mvn verify` at the pushed commit — which regenerates
# service/target/userstories/ through TokenValidationBootstrapIT — and the reports published as one
# docs bundle, site @userflows/qits-workspaces, version = the bare commit sha, branch riding as
# artifacts metadata for discovery.
#
# NON-GATING BY DESIGN, which is why it is a separate file from ci-post-receive.yml: this run going
# red must not cost the branch its image while "quality gate before merging" is still a decision to
# be taken — when it is, these per-commit runs are what the gate reads. One run per push per
# branch, collapsed to the newest tip under burst.
#
# `user: build`, and NOT a switch inside the script: the suites start zonky's embedded postgres,
# initdb refuses to run as root and calls getpwuid, so the step needs a passwd-backed non-root
# user — maven-base carries one (uid 1001). The step containers are Alpine, which is why `domain`
# and `service` both name zonky's -alpine binaries as a fourth arch; `domain`'s matters as much as
# `service`'s here, because its suite runs first and a missing arch would end this step two modules
# before the IT. qits-eventstream's pipeline is the measured precedent for all of it.
#
# Quinoa is off (`-Dquarkus.quinoa=false` — the extension's root toggle; `.enabled` is not it): the
# client is ci-post-receive.yml's business, this step never initialises the qits-spa-workspaces
# submodule, and the IT asserts nothing about the SPA. The packaged fast-jar failsafe boots is
# otherwise exactly what ships.
#
# THE IT IS OPTED IN BY NAME, and that is the one line here that differs from every sibling repo's
# copy of this file. `skipITs` is true in the root pom and stays true: five of this repo's six
# *IT.java are the docker-backed `extended` suite (a real container, the published qits/workspace
# image, the native daemon), and a bare `-DskipITs=false` would run them too — they self-skip, but
# a step that shells `docker image inspect` five times is precisely what the clone-alone rule
# forbids, and there is no docker in this container to shell. `-Dit.test` names the one IT that is
# about the artifact. Only `service` binds failsafe executions, so no other module is asked for a
# test it does not have.
#
# Loop review: this pipeline PUTs a docs bundle and pushes no commit — no cycle. Publish-if-absent:
# events redeliver and docs versions are immutable, so 409 is success (the qits-spa-ui-components
# release file's discipline).
event: SCMPublishCommit
when:
  - repoId: { exact: qits-workspaces }
    suppressCi: { exact: "false" }
checkout:
  branch: branch
  sha: sha
steps:
  - image: qits/build-images/maven-base:latest
    user: build
    timeout-seconds: 2400
    script: |
      set -eu
      # The platform registry, exactly as qits-eventstream's step derives it: the pom's default
      # names a host-published address unreachable from a step container, and the exact-id mirror
      # in .qits-maven-settings.xml is what passes Maven's HTTP blocker.
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL" \
        -Dquarkus.quinoa=false \
        -DskipITs=false \
        -Dit.test=TokenValidationBootstrapIT

      # `-C … .` so the story directories are the bundle's roots — nesting one directory deep would
      # put it in every served URL. The path is the module's, since `service` is the only module
      # with stories in it.
      tar -czf userstories.tgz -C service/target/userstories .

      # Branch and commit ride as metadata (the docs store's exact-match discovery keys); the
      # version is the sha itself, so a bundle URL never changes meaning.
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @userstories.tgz \
        -H "X-Artifacts-Meta-git.branch.name: $QITS_CI_BRANCH" \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: qits-workspaces" \
        "$QITS_DOCS_URL/@userflows/qits-workspaces/-/$QITS_CI_SHA")
      case "$status" in
        201) echo "published userflows for qits-workspaces@$QITS_CI_SHA ($QITS_CI_BRANCH)" ;;
        409) echo "userflows for qits-workspaces@$QITS_CI_SHA already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac
