# How qits-platform-deployments deploys this repo. It reads this file from the git host at
# the built sha, so the answer travels with the commit.
#
# CARRYING THE FILE AT ALL is the other thing it says. qits-workspaces reads it on a release to
# decide whether this repository deploys — a library or an SPA carries none and its release is
# the trunk push alone — and then promotes onto the branch it is configured with
# (`qits.workspaces.release.entry-branch`). `deploy_branches` used to name that branch here, in
# thirteen copies of one platform-wide answer, and a release pushed onto every entry it named.
#
# qits-workspaces is an ENVIRONMENT service: one instance per tier, the default target, so the
# `deployment_target` key is left off rather than written out as its own default.
#
# The path prefix the edge routes here on EVERY host, browser and machine alike. The client itself
# is served at `/` on this service's own host (workspaces.<env>.<domain>), so this covers the machine
# surface only: /workspaces/api, /workspaces/q and the four literal wire routes under it.
routes: /workspaces

# WHAT THIS REPOSITORY DEPLOYS AS, held still across the repository rename. The repository is
# qits-workspaces-service now; the application is still qits-workspaces, so nothing that is running
# moves: the swarm service and its wire alias, the container, the image qits/qits-workspaces the
# build pushes, the provisioned database, the derived host label, the extras family and the
# QITS_APPLICATION the container boots with all keep the names they have. Omitted, this name would
# be DERIVED from the repository, and the rename would read as a decommission plus a new application
# rather than a rename. Changing the value later is exactly that decommission, so it does not change
# again.
application: qits-workspaces

# Where this application appears in the chrome's navigation tree. `<slot>.<Label>:<position>[=subpath]`,
# and the slot is what places it. `<category>.details` is a child of a repository in scope, so Workspaces
# shows up under a repository of any kind; `project.detail` is a child of the Project node, where it
# means the project wrapper's own workspaces — the aggregate ones, which is what this service exists
# for. Positions are per slot: 8 is Workspaces' place in the platform's fixed order of the
# per-repository applications (Api Docs 1, Docs 2, Release Requests 3, Code 4, CI 5, Artifacts 6,
# Configuration 7, Workspaces 8); under `project.detail` this application owns 1 (Workspaces) and
# 2 (Editor), which was free.
#
# WORKSPACES MOVED 7 -> 8 ON 2026-09-01, and nothing about this application changed. qits-projects
# put a Release Requests row at position 3, above Code, and every entry from Code down moved up one
# in the same change — this file, qits-githost, qits-ci, qits-artifacts and qits-configuration, one
# line each. The order is stated in integers rather than left to the edge's position-then-label
# tie-break so that renaming a row cannot silently reorder the group.
#
# EDITOR IS A PROJECT ROW AND NEVER A REPOSITORY ONE: `=editor` is the SPA's own bare `editor`
# route, which takes no repository segment because a project has ONE editor and it rides the
# aggregate workspace — the wrapper's. It sits directly under Workspaces because it is the same
# workspace, opened another way.
#
# TWO ROWS IN ONE SLOT WAS A REFUSAL until 2026-08-31: the deployer's DeploymentSpecParser, the
# edge's EdgeRoutes AND the edge_navigation_entry primary key all admitted one entry per slot per
# application, and this line made the whole spec unreadable — the deployment FAILED while CI stayed
# green. All three key the claim on (slot, label) now, and the ui-components shell renders two
# same-application rows correctly since 2026.831.134647 (row keys carry the label; the page goes to
# the longest matching subpath). This entry therefore requires those releases deployed underneath it.
navigation-entries: services.details.Workspaces:8, daemons.details.Workspaces:8, libs.details.Workspaces:8, frontends.details.Workspaces:8, cli.details.Workspaces:8, images.details.Workspaces:8, project.detail.Workspaces:1, project.detail.Editor:2=editor

# ONE KEY, AND IT ASKS FOR TWO DATABASES, because two jars in this deployable each own one.
#
#   postgresql:db                                     the `workspaces` datasource, this context's
#                                                     own store. No third segment, so the database
#                                                     name is derived: `qits_workspaces`.
#   postgresql:eventstream:qits_workspaces_eventstream the outbox's, declared by the qits-eventstream
#                                                     jar. Named explicitly, because the derived
#                                                     default would collide with every other
#                                                     consumer of that library on the same postgres.
#
# The deployer creates a role and a database for each before the successor container starts and
# injects QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD and QITS_RESOURCE_EVENTSTREAM_* into it. The
# variable names follow the resource NAME, so `eventstream` is not a label chosen here — it is what
# the library's own shipped defaults read back, and renaming it stops matching them.
#
# Nothing in the deployer is workspaces-specific: an application maps the generic variables in its
# own config defaults, which the domain jar's META-INF/microprofile-config.properties does for the
# first and the qits-eventstream jar does for the second.
resources: postgresql:db, postgresql:eventstream:qits_workspaces_eventstream

# Where the browsable API document lives: swagger-ui under this service's non-application
# root, which sits under the primary route above. The shell's Api Docs viewer reads it off
# /main-navigation and frames it for this repository.
api-docs: /workspaces/q/swagger-ui
