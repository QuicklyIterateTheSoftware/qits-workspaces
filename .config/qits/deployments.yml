# How qits-platform-deployments deploys this repo. It reads this file from the git host at
# the built sha, so the answer travels with the commit.
#
# CARRYING THE FILE AT ALL is the other thing it says. qits-workspaces reads it on a release to
# decide whether this repository deploys — a library or an SPA carries none and its release is
# the trunk push alone — and then promotes onto the branch it is configured with
# (`qits.workspaces.release.entry-branch`). `deploy_branches` used to name that branch here, in
# thirteen copies of one platform-wide answer, and a release pushed onto every entry it named.
#
# qits-workspaces is an ENVIRONMENT service: one instance per tier, the default target, so the
# `deployment_target` key is left off rather than written out as its own default.
#
# The path prefix the edge routes here on EVERY host, browser and machine alike. The client itself
# is served at `/` on this service's own host (workspaces.<env>.<domain>), so this covers the machine
# surface only: /workspaces/api, /workspaces/q and the four literal wire routes under it.
routes: /workspaces

# Where this application appears in the chrome's navigation tree. `<slot>.<Label>:<position>`, and
# the slot is what places it. `<category>.details` is a child of a repository in scope, so Workspaces
# shows up under a repository of any kind; `project.detail` is a child of the Project node, where it
# means the project wrapper's own workspaces — the aggregate ones, which is what this service exists
# for. Positions are per slot: 5 is the platform's fixed order of the per-repository applications
# (Docs 1, CI 2, Artifacts 3, Configuration 4, Workspaces 5).
navigation-entries: services.details.Workspaces:5, daemons.details.Workspaces:5, libs.details.Workspaces:5, frontends.details.Workspaces:5, cli.details.Workspaces:5, images.details.Workspaces:5, project.detail.Workspaces:1

# ONE KEY, AND IT ASKS FOR TWO DATABASES, because two jars in this deployable each own one.
#
#   postgresql:db                                     the `workspaces` datasource, this context's
#                                                     own store. No third segment, so the database
#                                                     name is derived: `qits_workspaces`.
#   postgresql:eventstream:qits_workspaces_eventstream the outbox's, declared by the qits-eventstream
#                                                     jar. Named explicitly, because the derived
#                                                     default would collide with every other
#                                                     consumer of that library on the same postgres.
#
# The deployer creates a role and a database for each before the successor container starts and
# injects QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD and QITS_RESOURCE_EVENTSTREAM_* into it. The
# variable names follow the resource NAME, so `eventstream` is not a label chosen here — it is what
# the library's own shipped defaults read back, and renaming it stops matching them.
#
# Nothing in the deployer is workspaces-specific: an application maps the generic variables in its
# own config defaults, which the domain jar's META-INF/microprofile-config.properties does for the
# first and the qits-eventstream jar does for the second.
resources: postgresql:db, postgresql:eventstream:qits_workspaces_eventstream

# Where the browsable API document lives: swagger-ui under this service's non-application
# root, which sits under the primary route above. The shell's Api Docs viewer reads it off
# /main-navigation and frames it for this repository.
api-docs: /workspaces/q/swagger-ui
