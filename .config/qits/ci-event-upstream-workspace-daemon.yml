# Follow the workspace image.
#
# qits-workspaces launches every workspace container from a pinned, registry-qualified reference
# (qits.workspace.image, in domain/.../META-INF/microprofile-config.properties). A pin does not
# follow anything by itself, so this is what moves it: qits-workspace-daemon publishes the image,
# this rewrites the tag, and the bump goes onto maintenance/ where ci-post-receive.yml releases it
# like any other change.
#
# THE RACE THIS FILE USED TO CARRY IS CLOSED. It triggered on SCMRelease, which fires when
# qits-workspace-daemon is TAGGED — and that repository then spends up to two hours building and
# pushing ~3.4 GB of layered toolchain, so the pin could name a version whose image was still
# uploading, or one whose build went red and never uploaded at all. That is not hypothetical: the
# value this file replaced (2026.809.192040) was written by such a bump and names nothing in the
# registry to this day. SoftwareRelease is fired when the ARTIFACT is published, so it says the one
# thing the pin needs to be true.
#
# THE SELECTION NAMES THE PACKAGE AND NOT THE REPOSITORY, and that is deliberate rather than a
# missing condition. SoftwareRelease's `repository` field carries the repository's ROW ID, and
# qits-workspace-daemon was registered by the projects self-seed reconcile, so its id is a UUID
# minted per platform instance — no committed config can name it, and a selection that tried would
# match nothing SILENTLY (CI logs matches and never non-matches). Unlike SCMRelease there is no
# `repositoryName` to fall back on. The package name is the stable coordinate here, and it is a
# sharper one anyway: it is the artifact this pin dereferences.
#
# WHICH IS ALSO WHY packageName IS qits/workspace AND NOT qits/workspace-daemon. That pipeline
# declares two docker artifacts. The daemon image is the small one qits-deployments reads; this is
# the layered one — the released toolchain with the daemon copied in as its entrypoint — and only
# the second is startable as a workspace. Selecting on packageType alone would fire this train
# twice per daemon release, once for an image no workspace can run.
event: SoftwareRelease
when:
  - packageType: { exact: docker }
    packageName: { exact: qits/workspace }
steps:
  - image: qits/build-images/node-base:latest
    timeout-seconds: 300
    script: |
      set -eu
      properties=domain/src/main/resources/META-INF/microprofile-config.properties

      version=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).version')
      # Digits and dots, nothing else. The version reaches a `sed` s### expression, and `#` is that
      # expression's own delimiter — a version carrying one closes it, and GNU sed's `e` command
      # then runs a shell. It also becomes part of an image reference, part of a URL and part of a
      # commit message. Refused rather than quoted: this is a calver, and nothing legitimate needs a
      # character outside the set. Validate before the value goes near a file, a reference or a
      # request, not after.
      case "$version" in
        ''|*[!0-9.]*) echo "refusing an implausible version: $version" >&2; exit 1 ;;
      esac

      current=$(sed -n -E 's#^qits\.workspace\.image=##p' "$properties")
      [ -n "$current" ] || { echo "no qits.workspace.image line in $properties" >&2; exit 1; }

      # Only the TAG moves. The registry host and repository path stay exactly as committed, because
      # this train has no business deciding how the host daemon spells the registry — that decision
      # is made once, in the properties file, and it is spelled for the host rather than for this
      # step container. Rebuilding the reference here would quietly re-decide it.
      #
      # `${current%:*}` cuts at the LAST colon, which is the tag separator only if the final path
      # segment has a colon at all. A value with no tag would otherwise get cut at the registry
      # port, so check the segment first and refuse rather than write nonsense.
      case "${current##*/}" in
        *:*) ;;
        *) echo "refusing: $current carries no tag" >&2; exit 1 ;;
      esac
      reference="${current%:*}:$version"

      # Already there. Exit clean and commit nothing: a release that changes no file must not push a
      # branch, or the maintenance leg cuts an empty release on every daemon release. Checked before
      # the probe below, so a re-delivered event costs no request either.
      [ "$reference" != "$current" ] || exit 0

      # THE PROBE: does the registry really hold that tag. SoftwareRelease is an ARTIFACT-published
      # event, so this should always pass — and it is here precisely because "should" is what the
      # previous shape also assumed. The declaration qits-ci announces on is a claim by the
      # publishing repository, not something qits-ci watched land, so one HTTP call is what turns it
      # into an observation.
      #
      # THE REPOSITORY PATH COMES OFF THE PIN, not off the event. Stripping the leading host segment
      # from the committed reference gives the path the registry knows (`qits/workspace`), so the
      # probe asks about the exact image the launcher will pull. A path spelled a second time here
      # could drift from the pin and pass while the pin was wrong.
      #
      # THE HOST DOES NOT. The pin carries how the HOST docker daemon reaches the registry
      # (localhost:8081), and from inside a step container that spelling is the container itself —
      # measured: the first firing of this file died on it in one second. $QITS_REGISTRY is the same
      # host-side spelling, so neither is usable here. What a step container CAN reach is
      # qits-platform-artifacts' own origin, which $QITS_MAVEN_REGISTRY_URL carries as origin+path —
      # and the OCI API sits at that origin's host root /v2, since a registry client accepts no path
      # prefix. Derived, not spelled: moving qits-artifacts moves both.
      artifacts_origin=$(printf '%s' "$QITS_MAVEN_REGISTRY_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
      #
      # manifests/<tag>, never tags/list: this registry answers tags/list with 200 and an empty
      # array for a repository that does not exist, so a probe on it would pass for anything.
      # A manifest that is not there is a 404, which -f turns into a non-zero exit. HEAD with the
      # Accept list, because a registry 404s a media type it will not negotiate.
      path="${current#*/}"
      path="${path%:*}"
      curl -fsS -o /dev/null -I \
        -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json" \
        "$artifacts_origin/v2/$path/manifests/$version"

      sed -i -E "s#^qits\.workspace\.image=.*#qits.workspace.image=$reference#" "$properties"
      after=$(sed -n -E 's#^qits\.workspace\.image=##p' "$properties")
      # A sed that matched nothing exits 0. Read the line back, so a reshaped properties file fails
      # here loudly instead of pushing a bump that bumped nothing.
      [ "$after" = "$reference" ] || { echo "rewrite did not take: $after" >&2; exit 1; }

      git add "$properties"
      git -c user.name="qits release train" -c user.email="release-train@qits.local" commit -q \
        -m "bump(qits-workspace-daemon@$version): follow the workspace image"
      git push --force "$QITS_CI_REPOSITORY_URL" HEAD:refs/heads/maintenance/qits-workspace-daemon
