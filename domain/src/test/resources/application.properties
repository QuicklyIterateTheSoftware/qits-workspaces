# The suite runs against in-memory H2 (no docker), overriding the file-H2 default shipped in
# domain's META-INF/microprofile-config.properties. clean-at-start wipes between runs.
quarkus.datasource.workspaces.db-kind=h2
quarkus.datasource.workspaces.jdbc.url=jdbc:h2:mem:workspaces;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.workspaces.datasource=workspaces
quarkus.hibernate-orm.workspaces.packages=eu.wohlben.qits.workspaces.entity
quarkus.flyway.workspaces.migrate-at-start=true
quarkus.flyway.workspaces.clean-at-start=true
quarkus.flyway.workspaces.locations=classpath:db/workspaces/migration

# The fixtures' bare origins go under target/, so a run leaves nothing behind. TestOrigin builds
# them there and FakeGitHostAddress points the mirror's fetch and push at them — which is what makes
# every push in this suite a real push into a real bare.
qits.repositories.data-dir=target/workspaces-test-data

# This service's own tree: the git mirrors, their worktrees and the metadata sidecars. Separate from
# the line above on purpose — that separation IS the change under test, so a suite that pointed both
# at one directory would prove nothing.
qits.workspaces.data-dir=target/workspaces-test-own

# The suite's fixtures are seconds old and change between assertions, so nothing may be served from
# a freshness window. Shipped default is 5s; here every read fetches.
qits.workspace.git.mirror-freshness-ms=0

# The coupler waits for a daemon's config to become readable before deciding the auto-start set
# (shipped default 20s). The fakes answer immediately or never, so a wait would only slow the
# suite: 0 means one read, same pattern as mirror-freshness above.
qits.services.autostart-connect-timeout-ms=0
