# Workspaces config defaults, shipped from this library jar.
#
# Library jars ship defaults as META-INF/microprofile-config.properties (ordinal 100) — a jar's
# application.properties is ignored — read by whichever app pulls the jar in. The consuming app's
# own application.properties (ordinal 250) and the environment override any of these.

# --- persistence ------------------------------------------------------------------------------
# This context owns its OWN named datasource + persistence unit + Flyway lineage: a separate
# file-based H2 under ~/.qits/data/workspaces, never sharing qits' default DB or its migration
# history (the artifacts/ci precedent). Because it is a separate physical DB, workspace.repository_id
# is a plain String column with NO cross-boundary FK. Tests override the url to in-memory H2.
#
# The url carries NO AUTO_SERVER. It did, inherited from the monorepo, and it is what killed the
# first native binary this repo produced: AUTO_SERVER makes the first opener start H2's own TCP
# server, org.h2.server.TcpServer is loaded by name and is not in the image, and the process died on
# its first connection with `Class "org.h2.server.TcpServer" not found` — wrapped by Flyway as
# "Unable to obtain connection from database". Every JVM test stayed green throughout, because the
# suite overrides this url to in-memory H2 and never opens the shipped one.
#
# Registering the server classes for reflection was the alternative and it is the wrong trade twice
# over. AUTO_SERVER buys a second process opening the same file, which this single-process service
# does not do — nothing else has ever opened this file. And it costs a database port listening on
# every interface, on the host that also attaches workspace containers to qits-net: every container
# would be able to reach this context's database directly, which is precisely what a workspace sandbox
# exists to prevent. Dropping the flag fixes both runtimes with one key rather than teaching the
# binary to do something the deployment never wanted. qits-ci and qits-artifacts dropped it for the
# same reason.
quarkus.datasource.workspaces.db-kind=h2
quarkus.datasource.workspaces.jdbc.url=jdbc:h2:file:${user.home}/.qits/data/workspaces/h2/workspaces

# A dedicated persistence unit bound to that datasource, owning only this module's entities.
quarkus.hibernate-orm.workspaces.datasource=workspaces
quarkus.hibernate-orm.workspaces.packages=eu.wohlben.qits.workspaces.entity

# Own Flyway lineage at a distinct classpath location so it never mixes with domain's db/migration.
quarkus.flyway.workspaces.migrate-at-start=true
quarkus.flyway.workspaces.baseline-on-migrate=true
quarkus.flyway.workspaces.locations=classpath:db/workspaces/migration

# --- this service's own data tree ----------------------------------------------------------------
# Where the git mirrors live (one per repository, plus the worktrees a merge runs in) and where the
# workspace metadata sidecars are written. Private to this service, beside its database and its
# event outbox, on the volume it already owns.
qits.workspaces.data-dir=${user.home}/.qits/data/workspaces

# This is the ONLY tree this service opens. There was a second key here, naming the shared volume of
# bare origins qits-artifacts serves, and it is gone because there is nothing left to point at it.
# Every repository operation (a branch create, a branch delete, a merge, a release) is a push to the
# git host over HTTP, and the volume's last reader — the sidecar fallback in WorkspaceMetadataStore —
# went with the sidecars that had already moved off it.

# --- where the git host answers -------------------------------------------------------------------
# Scheme, host and port with NO path — the same shape qits.projects.url and qits.observability.url
# already use, so one value works whether the call goes direct on qits-net or through the gateway.
# The /artifacts/git/<repoId> segment is qits-artifacts' own contract and is spelled in
# ConfiguredGitHostAddress, not here: it belongs to the git host rather than to a deployment.
#
# This is the push target of the integrate flow, and it exists because integrate deliberately does
# NOT advance the default branch by writing the ref in the bare origin this service already holds.
# That shortcut is what today's merge does, and it is why no merge this service ever performed
# produced a CI run: a filesystem ref update fires no post-receive. Pushing through the ordinary git
# host makes receive-pack the sole writer of the default branch, so the protection hook sees every
# release and the existing post-receive -> qits-ci -> build chain happens for the ordinary reason.
#
# Defaulted, unlike qits.projects.url, and the asymmetry is deliberate: an unresolvable repository
# registry 404s every repository-scoped route, so it fails closed at startup, while an unreachable
# git host costs exactly one endpoint and says so when it is called. The default is the qits-net
# shape because that is where this service runs in a deployment; a host-run process overrides it.
qits.artifacts.url=http://qits-artifacts:8080

# Every git call that talks to the git host — the mirror's clone and fetch, ls-remote, and every
# push — carries this deadline. One key rather than one per verb: they are the same failure, a
# wedged host pinning a request thread, and release, integrate and the workspace listing all answer
# synchronously. Local git inside the mirror keeps its unbounded wait, where a bound would only turn
# slow into broken.
#
# It replaces qits.workspace.integrate.push-timeout-ms, which named the one network call this
# service used to make. Nothing sets that key in any deployment; the rename is the widening.
qits.workspace.git.network-timeout-ms=120000

# How long a fetched mirror is trusted before a read refreshes it again. It bounds one thing: how
# stale an ahead/behind count or a conflict warning on the branch list may be. Nothing that DECIDES
# anything reads through it — branch existence is an ls-remote against the git host, and every flow
# about to write forces a refresh first. The window exists because the workspace listing computes
# ahead/behind for every workspace of a repository and a browser polls it.
qits.workspace.git.mirror-freshness-ms=5000

# The deploy branches a release is promoted to after the default branch has it: the same commit,
# pushed again onto each, fast-forward only and never forced. Those pushes are what deploy — qits-cd
# registers and deploys an application from a green build on a deploy branch, so the default branch
# builds and these branches ship.
#
# ALL OF THEM, because a repository listens on ONE and this service does not know which: a platform
# service deploys from platform/main, an environment service from environment/dev, and the answer is
# in the repository's own spec, which reading here is a recorded debt. The cost of not guessing is a
# second CI build on the branch nothing listens to. environment/dev is the branch of the dev
# environment row in qits-cd; a deployment with a differently named dev environment sets it to match.
#
# BLANK DISABLES PROMOTION and a release is then exactly what it was before this key existed. A
# failed promotion never fails the release, and it fails per branch: the release push is already
# accepted, so the failure is reported on that branch's entry in the response and logged at ERROR
# (ReleaseIntegrator, "the promotions").
qits.workspaces.release.promotion-branches=environment/dev,platform/main

# How long an integrate waits for a repository another one (or a pull/sync) is holding. The lease is
# not what makes concurrent integrates safe — the push is a compare-and-swap, so git rejects the
# loser either way — it is what turns "one of two fails" into "one waits". Capped so the wait cannot
# become the unbounded one the push timeout above exists to forbid.
qits.workspace.integrate.lease-wait-ms=60000

# --- the workspace container --------------------------------------------------------------------
# The image every workspace container runs. Its ENTRYPOINT is the workspace-daemon binary, with no
# `sleep infinity` fallback: a container whose daemon cannot start is not a usable workspace.
qits.workspace.image=qits/workspace:latest
qits.workspace.container-runtime=docker

# How a container addresses qits itself — the git host it self-clones from, and the control socket
# it dials home on. `auto` resolves host.docker.internal (Linux gets the --add-host alias).
qits.workspace.git-host=auto
qits.workspace.qits-port=8080
qits.workspace.network=qits-net
qits.workspace.container-network=network

# Caches shared across all workspace containers, so a fresh workspace does not re-download the
# world. Deployments running several stacks on one host must override these together with
# qits.workspace.network.
qits.workspace.claude-volume=qits_shared_dot_claude
qits.workspace.claude-mount=/claude-home
qits.workspace.maven-volume=qits_shared_m2
qits.workspace.pnpm-volume=qits_shared_pnpm

# A per-workspace named volume for /workspace, so the checkout survives a container being recreated
# onto a newer image. Turning this off makes every recreate a fresh clone.
qits.workspace.persist-workspace=true
qits.workspace.workspace-volume-prefix=qits_workspace_

# Resource caps. Blank means unset (the runtime's own default applies).
qits.workspace.memory-limit=4g
qits.workspace.pids-limit=
qits.workspace.cpus=
qits.workspace.timezone=

# Provisioning windows: how long to wait for the daemon's control socket to appear, and then for its
# self-clone (plus recursive submodules) to finish. The second is generous on purpose — a cold clone
# of a large repo is slow, and failing it early strands a half-provisioned container.
qits.workspace.provision.connect-timeout-ms=30000
qits.workspace.provision.timeout-ms=600000

# How long a DescribeConfig may take before the daemon is treated as not answering.
qits.workspace.config.describe-timeout-ms=10000

# Kill switch for the daemon's own push of committed work.
qits.workspace.auto-push.enabled=true

# The in-container workspace-daemon's HTTP API: the port it binds, and the bearer every proxied call
# presents. The proxy at /workspaces/container/{id}/** is the only thing that ever sends it.
#
# THIS TOKEN IS A HANDSHAKE CONSTANT, NOT A CREDENTIAL, and nothing should be built as though it
# were one. One value, shared by every container: no derivation, no per-workspace secret, no column,
# no migration. Its only job is to satisfy the daemon's bind precondition — WorkspaceApi refuses to
# bind at all without one, which is isolation that already exists and is not ours to remove. It is
# readable by every coding agent (an agent can read its own environment) and it opens every daemon,
# and that is accepted rather than overlooked: qits-net is trusted (migration-plan.md §9 item 21),
# the same posture that already lets that agent reach qits-projects directly. What makes it
# acceptable to defer is that the daemon's inbound listener goes away rather than the token getting
# harder — see the stage 2 dial-back tunnel.
#
# So: do not describe this as a boundary, in a javadoc, a comment or a review. That is how an
# accepted exposure becomes an assumed protection. If qits-net ever stops being trusted, the VALUE
# becomes per-workspace (an HMAC over the workspace id needs no storage) and the service starts
# refusing to boot without a real secret — the injection point, the env var and the proxy's bearer
# header do not move, which is why deferring costs nothing.
qits.workspace.daemon-api-port=13338
qits.workspace.daemon-api-token=qits-workspace-daemon

# The reverse tunnel: how a daemon at DaemonProtocol.TUNNEL_CAPABILITY_VERSION or above is reached,
# now that it binds 127.0.0.1 and has no address on qits-net at all. A loopback listener per
# workspace, whose accepted connections that workspace's daemon dials back for and pipes to its own
# API. The kill switch is an escape hatch for a broken tunnel, NOT a supported topology: a daemon at
# that capability has already stopped listening, so turning this off makes it unreachable rather
# than reachable the old way. The nonce ttl bounds one WebSocket dial on a docker network.
qits.workspace.daemon-tunnel.enabled=true
qits.workspace.daemon-tunnel.nonce-ttl-ms=10000

# Explicit rather than inherited: a tunnelled terminal is idle for long stretches, and the default
# (30 minutes) is one of three timers that could close it. Naming it here makes which one visible.
quarkus.http.idle-timeout=1H

# The identity workspace containers commit as.
qits.git.author-name=qits
qits.git.author-email=qits@local

# NOT claimed here, on purpose: qits.bootstrap.* and qits.services.* are read by
# WorkspaceContainerFactory only to forward them into the container as QITS_WORKSPACE_DAEMON_* env.
# They belong to the bootstrap and services contexts; this jar ships only the code-level
# defaultValue for them, because a library claiming another context's keys at ordinal 100 is a
# config-source collision.
